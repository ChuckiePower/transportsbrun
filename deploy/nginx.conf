# Exemple de configuration nginx équivalente (certificats Let's Encrypt via certbot).
# À placer dans /etc/nginx/sites-available/transports-brun.com puis :
#   sudo ln -s /etc/nginx/sites-available/transports-brun.com /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
# Obtenir les certificats (webroot) :
#   sudo certbot certonly --webroot -w /var/www/certbot -d transports-brun.com -d www.transports-brun.com

# HTTP → HTTPS (domaine nu), en laissant passer le challenge ACME
server {
    listen 80;
    listen [::]:80;
    server_name transports-brun.com www.transports-brun.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://transports-brun.com$request_uri;
    }
}

# www (HTTPS) → domaine nu
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.transports-brun.com;

    ssl_certificate     /etc/letsencrypt/live/transports-brun.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/transports-brun.com/privkey.pem;

    return 301 https://transports-brun.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name transports-brun.com;

    ssl_certificate     /etc/letsencrypt/live/transports-brun.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/transports-brun.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;

    # HSTS (1 an, sans includeSubDomains : voir DEPLOY.md). Les autres en-têtes
    # de sécurité sont envoyés par l'application.
    add_header Strict-Transport-Security "max-age=31536000" always;
    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/plain text/css application/javascript application/json application/xml
               image/svg+xml application/manifest+json text/xml;

    client_max_body_size 64k;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # IP réelle du client, NON cumulée ($remote_addr et non $proxy_add_x_forwarded_for)
        # pour qu'un visiteur ne puisse pas contourner la limitation de débit.
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 30s;
    }

    # Fichiers versionnés de Next.js : cache d'un an (Next l'envoie déjà ; repris ici)
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=31536000, immutable";
        # add_header dans un bloc location remplace ceux du serveur : on répète HSTS
        add_header Strict-Transport-Security "max-age=31536000" always;
    }

    access_log /var/log/nginx/transports-brun.access.log;
    error_log  /var/log/nginx/transports-brun.error.log warn;
}
