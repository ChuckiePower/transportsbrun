name: Mirror transports-brun.com

# À lancer à la main : onglet "Actions" du repo -> "Mirror transports-brun.com" -> "Run workflow".
# Le miroir est (1) ajouté au repo dans source-site/ et (2) téléchargeable en ZIP dans les "Artifacts" du run.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Mirror the site
        run: python tools/mirror_site.py

      - name: Upload ZIP as artifact
        uses: actions/upload-artifact@v4
        with:
          name: transports-brun-site
          path: transports-brun-site.zip

      - name: Commit the mirror into the repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add source-site images-manifest.json
          git commit -m "chore: miroir du site actuel transports-brun.com (source-site/)" || echo "Rien à committer"
          git push
